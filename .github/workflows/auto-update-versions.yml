name: Auto-Update Service Versions

on:
  # Run daily at 2 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Trigger from other repos when they release
  repository_dispatch:
    types: [service-released]

jobs:
  update-versions:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --save-dev octokit axios

      - name: Fetch latest releases from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-versions.js
        continue-on-error: false

      - name: Generate component-versions documentation
        run: node scripts/generate-versions-doc.js
        continue-on-error: false

      - name: Generate compatibility matrix
        run: node scripts/generate-compatibility.js
        continue-on-error: false

      - name: Check if changes exist
        id: verify-change
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit and push changes
        if: steps.verify-change.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add versions.json docs/component-versions.md docs-beta/component-versions.md docs-v0.0.1/component-versions.md COMPATIBILITY.md
          git commit -m "chore: auto-update microservice versions [skip ci]"
          git push

      - name: Create Pull Request (if changes)
        if: steps.verify-change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: auto-update microservice versions'
          title: 'chore: auto-update microservice versions'
          body: |
            ## 🔄 Automatic Version Update

            This PR automatically updates microservice versions from their latest GitHub releases.

            ### Changes
            - ✅ Updated `versions.json` with latest releases
            - ✅ Regenerated `component-versions.md` for all versions
            - ✅ Updated compatibility matrix in `COMPATIBILITY.md`

            ### What's Included
            - Latest stable version tags
            - Release dates
            - Docker image tags
            - Compatibility information

            _This PR was automatically generated by the version update workflow._
          branch: auto-update-versions
          delete-branch: true
          labels: 'documentation,automated'

      - name: Log completion
        if: always()
        run: |
          echo "Version update workflow completed"
          echo "Changed: ${{ steps.verify-change.outputs.changed }}"

